services:

  db:
    image: postgres:latest
    container_name: videoflix_database
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:latest
    container_name: videoflix_redis
    volumes:
      - redis_data:/data

  web:
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --reload --timeout 300
    build:
      context: .
      dockerfile: backend.Dockerfile
    env_file: .env
    container_name: videoflix_backend
    volumes:
      - .:/app
      # - videoflix_media:/app/media
      - videoflix_static:/app/static
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - db
      - redis

  rqworker:
    build:
      context: .
      dockerfile: backend.Dockerfile
    env_file: .env
    container_name: videoflix_rqworker
    command: python manage.py rqworker default
    volumes:
      - .:/app
      # - videoflix_media:/app/media
    depends_on:
      - db
      - redis
    entrypoint: ["./rqworker.entrypoint.sh"]

volumes:
  postgres_data:
  redis_data:
  # videoflix_media:
  videoflix_static:
